# 配置3: 单元格跨页 - 允许单元格内容跨页显示
data_paths:
  text: "examples/data/stock.json"
  image: "examples/data/figure.json"
  table: "examples/data/a_stock_table.json"
  formula: "examples/data/formula.json"
  title: ""
work_path:
  template_path: "templates"
  template_file: "cell_break/document_cell_break.html.jinja"  # 使用单元格跨页模板
  template_get_data: "cell_break/getData"
  html_path: "/home/ma-user/work/wbd/GET_DATA/SynPandas/working/cell_break/html/output_{i}.html"
  save_image_dir: "working/cell_break/image/"
  output_gt_path: "working/cell_break/ground_truth/result_of_id{i}.json"
  result: "cell_break/results.json"
defaults:
  save_path: "Temp"
  save_every_n: 4
  
multipage:
  enabled: true
  table:
    max_rows_per_page: 15

layout_config:
  element:
    table: 4  # 包含表格
    figure: 0
    title: 0
    text: 3
    formula: 0
    header: 1
    footer: 1
    page_footnote: 0
  columns: 1

num_workers: 1
nums: 10
